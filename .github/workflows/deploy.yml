name: Deploy to GitHub Pages

# Déclenchements :
#  - push sur main
#  - manuel via l'onglet Actions
on:
  push:
    branches: [feat/glass-redesign]
  workflow_dispatch:

# Permissions minimales nécessaires pour publier sur GitHub Pages
# via le mécanisme officiel (deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Empêche deux déploiements simultanés ; on annule pas les déploiements
# en cours pour éviter de publier un état partiellement construit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build (production)
        # GITHUB_REPOSITORY est exposé automatiquement par Actions :
        # vite.config.ts s'en sert pour fixer base = '/<repo>/'.
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
