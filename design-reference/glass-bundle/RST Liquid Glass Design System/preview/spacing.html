<!doctype html>
<html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; font-family: var(--f-text); background: var(--bg-canvas); overflow:hidden; padding: 28px; box-sizing:border-box; width: 700px; }
  .row { display:grid; grid-template-columns: 60px 1fr 70px; align-items:center; row-gap: 8px; column-gap: 16px; }
  .name { font-size: 12px; font-weight: 600; color: var(--ink-1); font-family: var(--f-mono); }
  .bar { height: 12px; background: var(--rst-blue); border-radius: 6px; opacity: .85; }
  .meta { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); text-align: right; }
</style></head>
<body>
  <div class="row">
    <div class="name">4</div>  <div class="bar" style="width:4px"></div>   <div class="meta">4 px</div>
    <div class="name">8</div>  <div class="bar" style="width:8px"></div>   <div class="meta">8 px</div>
    <div class="name">12</div> <div class="bar" style="width:12px"></div>  <div class="meta">12 px</div>
    <div class="name">16</div> <div class="bar" style="width:16px"></div>  <div class="meta">16 px</div>
    <div class="name">24</div> <div class="bar" style="width:24px"></div>  <div class="meta">24 px</div>
    <div class="name">32</div> <div class="bar" style="width:32px"></div>  <div class="meta">32 px</div>
    <div class="name">48</div> <div class="bar" style="width:48px"></div>  <div class="meta">48 px</div>
    <div class="name">64</div> <div class="bar" style="width:64px"></div>  <div class="meta">64 px</div>
    <div class="name">80</div> <div class="bar" style="width:80px"></div>  <div class="meta">80 px</div>
    <div class="name">120</div><div class="bar" style="width:120px"></div> <div class="meta">120 px</div>
  </div>
</body></html>
