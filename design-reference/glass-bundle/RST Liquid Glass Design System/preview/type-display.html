<!doctype html>
<html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; font-family: var(--f-text); background: var(--bg-canvas); overflow:hidden; padding: 28px; box-sizing: border-box; width: 700px; }
  .stack { display:flex; flex-direction:column; gap: 18px; }
  .row { display:flex; align-items: baseline; gap: 18px; }
  .row .meta { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); margin-left: auto; flex-shrink:0; }
  .display { font-family: var(--f-display); font-size: 56px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; color: var(--ink-1); }
  .h1 { font-family: var(--f-display); font-size: 36px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; color: var(--ink-1); }
  .h2 { font-family: var(--f-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink-1); }
  .h3 { font-family: var(--f-display); font-size: 19px; font-weight: 600; color: var(--ink-1); }
  .body { font-family: var(--f-text); font-size: 15px; line-height: 1.5; color: var(--ink-2); }
  .caption { font-family: var(--f-text); font-size: 12px; color: var(--ink-3); }
</style></head>
<body>
  <div class="stack">
    <div class="row"><div class="display">Liquid Glass</div><div class="meta">Display · 56 / 700</div></div>
    <div class="row"><div class="h1">Une assemblée fondée sur le Roc</div><div class="meta">H1 · 36 / 700</div></div>
    <div class="row"><div class="h2">Projet Néhémie</div><div class="meta">H2 · 26 / 600</div></div>
    <div class="row"><div class="h3">Cette semaine au tabernacle</div><div class="meta">H3 · 19 / 600</div></div>
    <div class="row"><div class="body">Découvrez la genèse de notre assemblée et les rendez-vous de la semaine.</div><div class="meta">Body · 15 / 400</div></div>
    <div class="row"><div class="caption">VITRY-SUR-SEINE · ÎLE-DE-FRANCE</div><div class="meta">Caption · 12 / 400</div></div>
  </div>
</body></html>
