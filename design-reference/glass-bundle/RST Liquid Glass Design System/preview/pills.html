<!doctype html>
<html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>
  body { margin:0; font-family: var(--f-text); overflow:hidden; padding: 28px; box-sizing:border-box; width: 700px;
    background: radial-gradient(500px 250px at 50% 0%, rgba(30,71,161,.10), transparent 60%), var(--bg-canvas);
  }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom: 14px; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-4); width: 90px; }
</style></head>
<body>
  <div class="row"><div class="label">Status</div>
    <span class="pill pill--live">Live</span>
    <span class="pill pill--blue">Cantique</span>
    <span class="pill">Annonce</span>
    <span class="pill pill--neutral">Témoignage</span>
  </div>
  <div class="row"><div class="label">Meta</div>
    <span class="pill">Dim · 10:00</span>
    <span class="pill">Vitry-sur-Seine</span>
    <span class="pill">FR · EN</span>
    <span class="pill pill--blue">Néhémie 4·6</span>
  </div>
  <div class="row"><div class="label">Tab</div>
    <span class="pill" style="background:var(--glass-solid);box-shadow:0 1px 2px rgba(11,15,25,.06),inset 0 1px 0 rgba(255,255,255,.7);color:var(--ink-1);">Cette semaine</span>
    <span class="pill" style="background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-3);">Cantiques</span>
    <span class="pill" style="background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-3);">Annonces</span>
    <span class="pill" style="background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-3);">Témoignages</span>
  </div>
</body></html>
