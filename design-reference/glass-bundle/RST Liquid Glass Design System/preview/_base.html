<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--f-text);
    color: var(--ink-1);
    background:
      radial-gradient(1200px 600px at 8% 0%, rgba(30, 71, 161, 0.10), transparent 60%),
      radial-gradient(900px 500px at 92% 100%, rgba(200, 51, 42, 0.08), transparent 60%),

  .frame {
    box-sizing: border-box;

    font-family: var(--f-text);
