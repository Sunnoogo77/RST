<!doctype html>
<html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; font-family: var(--f-text); background: var(--bg-canvas); overflow:hidden; padding: 28px; box-sizing:border-box; width: 700px; }
  .grid { display:grid; grid-template-columns: 130px 1fr 110px; gap: 14px 24px; align-items: center; }
  .label { font-family: var(--f-text); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4); }
  .meta { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
  .sf { font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-1); }
  .text { font-family: var(--f-text); font-size: 16px; color: var(--ink-2); }
  .serif { font-family: var(--f-serif); font-size: 26px; font-style: italic; color: var(--ink-1); font-weight: 500; }
  .engrave { font-family: var(--f-engrave); font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-1); }
</style></head>
<body>
  <div class="grid">
    <div class="label">Display</div>
    <div class="sf">SF Pro Display — Adorer et Édifier</div>
    <div class="meta">SF Pro / Inter</div>

    <div class="label">Text</div>
    <div class="text">SF Pro Text — corps de paragraphe pour la lisibilité.</div>
    <div class="meta">SF Pro / Inter</div>

    <div class="label">Serif</div>
    <div class="serif">Adorer et Édifier</div>
    <div class="meta">Cormorant</div>

    <div class="label">Engrave</div>
    <div class="engrave">Roc Séculaire Tabernacle</div>
    <div class="meta">Cinzel</div>
  </div>
</body></html>
