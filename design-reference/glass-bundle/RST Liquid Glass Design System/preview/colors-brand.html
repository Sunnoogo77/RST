<!doctype html>
<html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>
  body { margin:0; font-family: var(--f-text); background:
    radial-gradient(700px 300px at 10% 0%, rgba(30,71,161,.10), transparent 60%),
    radial-gradient(500px 250px at 95% 100%, rgba(200,51,42,.10), transparent 60%),
    var(--bg-canvas); overflow:hidden; }
  .wrap { box-sizing:border-box; width:700px; padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .swatch { border-radius: 16px; padding: 14px; min-height: 84px; display:flex; flex-direction:column; justify-content:space-between; box-shadow: var(--shadow-2); border: 1px solid rgba(255,255,255,.5); }
  .swatch .name { font-size:13px; font-weight:600; letter-spacing:-0.005em; }
  .swatch .hex { font-family: var(--f-mono); font-size:11px; opacity:.85; }
  .swatch.light { color: var(--ink-1); }
  .swatch.dark  { color: #fff; }
</style></head>
<body><div class="wrap">
  <div class="swatch dark" style="background:#C8332A">
    <div class="name">RST Red</div><div class="hex">#C8332A · LIVE / accent</div></div>
  <div class="swatch dark" style="background:#A6231A">
    <div class="name">Red Deep</div><div class="hex">#A6231A · pressed</div></div>
  <div class="swatch dark" style="background:#1E47A1">
    <div class="name">RST Blue</div><div class="hex">#1E47A1 · primary CTA</div></div>
  <div class="swatch dark" style="background:#15366E">
    <div class="name">Blue Deep</div><div class="hex">#15366E · pressed</div></div>
  <div class="swatch light" style="background:#E26057">
    <div class="name">Red Soft</div><div class="hex">#E26057 · tint</div></div>
  <div class="swatch light" style="background:#4F73C7">
    <div class="name">Blue Soft</div><div class="hex">#4F73C7 · tint</div></div>
</div></body></html>
